<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI & Synth Chord Analyzer</title>
    <link rel="shortcut icon" href="#">

    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Tonal.js -->
    <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
    <script>
        if (typeof Tonal === 'undefined') {
            document.write('<script src="https://unpkg.com/tonal/browser/tonal.min.js"><\/script>');
        }
    </script>

    <!-- VexFlow -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #eee; padding: 20px; margin: 0; }
        .container { max-width: 1080px; margin: 0 auto; }
        .panel { background: #1e1e1e; padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #333; }
        
        .midi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        select { background: #2b2b2b; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
        .control-group { display: flex; flex-direction: column; font-size: 12px; gap: 4px; }
        .control-group input, .control-group select { cursor: pointer; }
        
        /* 鍵盤UI */
        .keyboard { position: relative; height: 110px; display: flex; user-select: none; margin-top: 10px; overflow-x: auto; }
        .key { border: 1px solid #000; box-sizing: border-box; cursor: pointer; text-align: center; font-size: 10px; padding-top: 75px; }
        .key.white { background: #fff; color: #000; width: 36px; height: 110px; z-index: 1; }
        .key.black { background: #000; color: #fff; width: 22px; height: 68px; margin-left: -11px; margin-right: -11px; z-index: 2; padding-top: 45px; }
        .key.active { background: #ff4d4d !important; color: #fff !important; }
        
        /* メイン五線譜表示 */
        #staff { background: #fff; border-radius: 4px; padding: 5px; height: 130px; user-select: none; }
        
        /* 8小節履歴 (横幅1/2, 縦幅2倍 = 高さ220px / 横1列) */
        .history-container { overflow-x: auto; width: 100%; }
        .history-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 10px; min-width: 800px; }
        .measure-box { background: #fff; border-radius: 4px; height: 220px; position: relative; border: 2px dashed #555; box-sizing: border-box; }
        .measure-box.dragover { border-color: #ff9800; background: #fff8e1; }
        .measure-label { position: absolute; top: 3px; left: 4px; font-size: 11px; color: #666; font-weight: bold; z-index: 10; }
        .measure-chord { position: absolute; top: 3px; right: 4px; font-size: 11px; font-weight: bold; color: #d32f2f; z-index: 10; word-break: break-all; text-align: right; }

        /* 結果＆ボタンエリア */
        .result-box { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .draggable-chord { background: #ff9800; color: #000; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: grab; display: inline-block; }
        .btn { border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .reset-btn { background: #e53935; color: white; }
        .add-hist-btn { background: #2196f3; color: white; }
        .clear-hist-btn { background: #616161; color: white; font-size: 12px; }
        .play-btn { background: #4caf50; color: white; }
        .play-btn.playing { background: #ff9800; }

        /* テンキープール (1〜0) */
        .pool-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .pool-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .pool-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .pool-box { border: 2px dashed #555; background: #2a2a2a; height: 65px; border-radius: 6px; text-align: center; padding: 6px; font-size: 11px; transition: background 0.2s; }
        .pool-box.dragover { border-color: #ff9800; background: #333; }
        .pool-box.active-play { border-color: #4caf50; background: #1b3e1d; }
        .pool-box .num { font-weight: bold; color: #aaa; }
        .pool-box .chord-val { display: block; margin-top: 4px; font-size: 14px; color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>MIDI & Synth Chord Analyzer</h2>

    <!-- MIDIデバイス選択（入力/出力） -->
    <div class="panel">
        <div class="midi-grid">
            <div>
                <label><strong>MIDI入力デバイス:</strong></label>
                <select id="midi-in-select" style="margin-top: 6px;">
                    <option value="">検出中...</option>
                </select>
            </div>
            <div>
                <label><strong>MIDI出力デバイス:</strong></label>
                <select id="midi-out-select" style="margin-top: 6px;">
                    <option value="">検出中...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- シンセパラメーター -->
    <div class="panel">
        <strong>Synth Parameters (Sawtooth + Lowpass Filter + ADSR)</strong>
        <div class="controls" style="margin-top: 10px;">
            <div class="control-group"><label>Filter Cutoff</label><input type="range" id="cutoff" min="100" max="8000" value="2500"></div>
            <div class="control-group"><label>Attack (s)</label><input type="range" id="attack" min="0.01" max="2" step="0.01" value="0.05"></div>
            <div class="control-group"><label>Decay (s)</label><input type="range" id="decay" min="0.01" max="2" step="0.01" value="0.2"></div>
            <div class="control-group"><label>Sustain</label><input type="range" id="sustain" min="0" max="1" step="0.01" value="0.5"></div>
            <div class="control-group"><label>Release (s)</label><input type="range" id="release" min="0.1" max="5" step="0.1" value="1.0"></div>
        </div>
    </div>

    <!-- 鍵盤UI -->
    <div class="panel">
        <strong>鍵盤 (PCキー: awsedftgyhujkolp;:[])</strong>
        <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- メイン五線譜 -->
    <div class="panel">
        <strong>現在の入力音符（全音符を個別ドラッグで移動可能 / 選択された音符は赤色で視覚化）</strong>
        <div id="staff" style="margin-top: 6px;"></div>
    </div>

    <!-- 判定結果＆操作 -->
    <div class="panel result-box">
        <div>
            <div>判定コード: <span id="chord-drag" class="draggable-chord" draggable="true">---</span></div>
            <div style="margin-top: 6px; font-size: 13px;">推測スケール: <span id="scale-res" style="color: #4fc3f7;">---</span></div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn add-hist-btn" onclick="addCurrentToHistory()">小節履歴に追加</button>
            <button class="btn reset-btn" onclick="resetNotes()">判定リセット</button>
        </div>
    </div>

    <!-- 8小節コード履歴（横一列・縦長レイアウト） -->
    <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>8小節コード履歴 (ドラッグ＆ドロップ保存 / 8小節横1列表示)</strong>
            <button class="btn clear-hist-btn" onclick="clearHistory()">履歴全消去</button>
        </div>
        <div class="history-container">
            <div class="history-grid" id="history-grid"></div>
        </div>
    </div>

    <!-- テンキー用コードプール ＆ 再生コントロール -->
    <div class="panel">
        <div class="pool-header">
            <strong>コードプール (ドラッグ＆ドロップ保存 / テンキー1〜9, 0でコード発音)</strong>
            <div class="pool-controls">
                <button id="pool-play-btn" class="btn play-btn" onclick="togglePoolPlayback()">▶ 再生</button>
                <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
                    <label>BPM:</label>
                    <input type="range" id="pool-bpm" min="30" max="300" value="120" style="width:80px;" oninput="document.getElementById('bpm-val').innerText = this.value">
                    <span id="bpm-val">120</span>
                </div>
                <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
                    <label>音価:</label>
                    <select id="pool-duration" style="width:auto; padding:4px 8px;">
                        <option value="1n">全音符</option>
                        <option value="2n">2分音符</option>
                        <option value="4n" selected>4分音符</option>
                        <option value="8n">8分音符</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="pool-grid" id="pool-grid"></div>
    </div>
</div>

<script>
// --- 音名マッピングデータ ---
const NOTES = ['C4','C#4','D4','D#4','E4','F4','F#4','G4','G#4','A4','A#4','B4','C5','C#5','D5','D#5','E5','F5','F#5','G5'];
const SHARP_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT_NAMES  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const POOL_KEYS   = ['1','2','3','4','5','6','7','8','9','0'];

const PC_KEY_MAP = {
    'a':'C4', 'w':'C#4', 's':'D4', 'e':'D#4', 'd':'E4', 'f':'F4',
    't':'F#4', 'g':'G4', 'y':'G#4', 'h':'A4', 'u':'A#4', 'j':'B4',
    'k':'C5', 'o':'C#5', 'l':'D5', 'p':'D#5', ';':'E5', ':':'F5',
    '[':'F#5', ']':'G5'
};

let activeNotes = new Set();
let selectedNoteName = null; // 五線譜上で選択された音符
let chordHistory = new Array(8).fill(null);
let poolData = {}; 
let synth, filter;

let midiAccessObj = null;
let currentMidiInput = null;
let currentMidiOutput = null;

let isPlayingPool = false;
let poolPlayTimeout = null;

// --- VexFlow用 音名安全変換処理 ---
function parseNoteForVex(noteStr) {
    if (typeof Tonal === 'undefined') return { key: "c/4", acc: "" };
    const p = Tonal.Note.get(noteStr);
    const letter = (p.letter || 'C').toLowerCase();
    const acc = p.acc || ''; 
    const oct = (p.oct !== undefined && p.oct !== null) ? p.oct : 4;
    return { key: `${letter}${acc}/${oct}`, acc: acc };
}

// --- 1. Tone.js オーディオ初期化 ---
function initAudio() {
    if (synth) return;
    Tone.start();
    filter = new Tone.Filter({ frequency: 2500, type: "lowpass" }).toDestination();
    synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth" },
        envelope: { attack: 0.05, decay: 0.2, sustain: 0.5, release: 1.0 }
    }).connect(filter);

    document.getElementById('cutoff').oninput = (e) => filter.frequency.value = parseFloat(e.target.value);
    document.getElementById('attack').oninput = (e) => synth.set({ envelope: { attack: parseFloat(e.target.value) } });
    document.getElementById('decay').oninput = (e) => synth.set({ envelope: { decay: parseFloat(e.target.value) } });
    document.getElementById('sustain').oninput = (e) => synth.set({ envelope: { sustain: parseFloat(e.target.value) } });
    document.getElementById('release').oninput = (e) => synth.set({ envelope: { release: parseFloat(e.target.value) } });
}

// --- 2. 鍵盤UI作成 ---
const keyboardEl = document.getElementById('keyboard');
NOTES.forEach(note => {
    const isBlack = note.includes('#');
    const keyEl = document.createElement('div');
    keyEl.className = `key ${isBlack ? 'black' : 'white'}`;
    keyEl.dataset.note = note;
    keyEl.innerText = note;
    keyEl.onmousedown = () => toggleNote(note);
    keyboardEl.appendChild(keyEl);
});

// --- 3. ノート発音・制御 (同じ鍵盤で削除するトグル方式) ---
function toggleNote(note) {
    initAudio();
    if (activeNotes.has(note)) {
        activeNotes.delete(note);
        synth.triggerRelease(note);
        if (selectedNoteName === note) selectedNoteName = null;
    } else {
        activeNotes.add(note);
        synth.triggerAttack(note);
        selectedNoteName = note;
        sendMidiNote(note, true);
    }
    updateAll();
}

function resetNotes() {
    if (synth) synth.releaseAll();
    activeNotes.clear();
    selectedNoteName = null;
    updateAll();
}

function midiToNoteName(midiNum, direction) {
    const octave = Math.floor(midiNum / 12) - 1;
    const pc = ((midiNum % 12) + 12) % 12;
    const name = (direction === 'up') ? SHARP_NAMES[pc] : FLAT_NAMES[pc];
    return `${name}${octave}`;
}

// --- 4. 解析＆全UIアップデート ---
function updateAll() {
    document.querySelectorAll('.key').forEach(el => {
        if (activeNotes.has(el.dataset.note)) el.classList.add('active');
        else el.classList.remove('active');
    });

    const notesArr = Array.from(activeNotes).sort((a,b) => {
        const ma = typeof Tonal !== 'undefined' ? Tonal.Note.midi(a) : 0;
        const mb = typeof Tonal !== 'undefined' ? Tonal.Note.midi(b) : 0;
        return ma - mb;
    });

    const chordDrag = document.getElementById('chord-drag');
    const scaleRes = document.getElementById('scale-res');

    if (notesArr.length > 0 && typeof Tonal !== 'undefined') {
        try {
            const detectedChords = Tonal.Chord.detect(notesArr);
            const pitchClasses = Array.from(new Set(notesArr.map(n => Tonal.Note.get(n).pc)));
            const detectedScales = Tonal.Scale.detect(pitchClasses);

            chordDrag.innerText = detectedChords.length > 0 ? detectedChords[0] : "判定不能";
            scaleRes.innerText = detectedScales.length > 0 ? detectedScales.slice(0, 2).join(', ') : "該当なし";
        } catch (e) {
            chordDrag.innerText = "解析エラー";
            scaleRes.innerText = "---";
        }
    } else {
        chordDrag.innerText = "---";
        scaleRes.innerText = "---";
    }

    renderMainStaff(notesArr);
    renderHistoryGrid();
}

// --- 5. メイン五線譜描画 (個別音符ドラッグ＆ターゲット選択視覚化) ---
function renderMainStaff(notes) {
    const staffDiv = document.getElementById('staff');
    staffDiv.innerHTML = "";
    if (typeof Vex === 'undefined') return;

    const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;
    
    const renderer = new Renderer(staffDiv, Renderer.Backends.SVG);
    renderer.resize(980, 120);
    const context = renderer.getContext();
    const stave = new Stave(10, 0, 950);
    stave.addClef("treble").setContext(context).draw();

    if (notes.length === 0) return;

    try {
        const parsedNotes = notes.map(parseNoteForVex);
        const keys = parsedNotes.map(p => p.key);

        const staveNote = new StaveNote({ keys: keys, duration: "w" });
        parsedNotes.forEach((p, idx) => {
            if (p.acc) staveNote.addModifier(new Accidental(p.acc), idx);
        });

        const voice = new Voice({ num_beats: 4, beat_value: 4 });
        voice.addTickables([staveNote]);
        new Formatter().joinVoices([voice]).format([voice], 400);
        voice.draw(context, stave);

        // 各音符 (NoteHead) のドラッグ＆ドロップおよび選択処理
        const noteHeads = staffDiv.querySelectorAll('.vf-notehead');
        noteHeads.forEach((headEl, idx) => {
            const currentNote = notes[idx];
            headEl.style.cursor = 'ns-resize';

            // ターゲット選択されている音符を赤色ハイライト
            if (currentNote === selectedNoteName) {
                headEl.querySelectorAll('path').forEach(p => p.setAttribute('fill', '#ff4d4d'));
            }

            headEl.onmousedown = (e) => {
                e.preventDefault();
                e.stopPropagation();
                selectedNoteName = currentNote;
                updateAll(); // 選択ターゲットを即座に赤色に更新

                const startY = e.clientY;
                const initialMidi = Tonal.Note.midi(currentNote);

                const onMouseMove = (moveEvt) => {
                    const diffY = startY - moveEvt.clientY;
                    const semitoneShift = Math.round(diffY / 12);

                    if (semitoneShift !== 0 && initialMidi) {
                        const direction = semitoneShift > 0 ? 'up' : 'down';
                        const newMidi = initialMidi + semitoneShift;
                        const newNoteName = midiToNoteName(newMidi, direction);

                        if (newNoteName !== currentNote && !activeNotes.has(newNoteName)) {
                            activeNotes.delete(currentNote);
                            activeNotes.add(newNoteName);
                            selectedNoteName = newNoteName;

                            initAudio();
                            synth.triggerAttackRelease(newNoteName, "8n");
                            sendMidiNote(newNoteName, true);

                            window.removeEventListener('mousemove', onMouseMove);
                            window.removeEventListener('mouseup', onMouseUp);
                            updateAll();
                        }
                    }
                };

                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            };
        });

    } catch (e) {
        console.error("VexFlow Error:", e);
    }
}

// --- 6. 8小節コード履歴 (縦長220px・横1列表示) ---
const historyGrid = document.getElementById('history-grid');

function renderHistoryGrid() {
    historyGrid.innerHTML = "";
    if (typeof Vex === 'undefined') return;
    const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;

    for (let i = 0; i < 8; i++) {
        const box = document.createElement('div');
        box.className = 'measure-box';
        box.dataset.index = i;
        
        const label = document.createElement('span');
        label.className = 'measure-label';
        label.innerText = `M${i+1}`;
        box.appendChild(label);

        const data = chordHistory[i];
        if (data) {
            const chordLabel = document.createElement('span');
            chordLabel.className = 'measure-chord';
            chordLabel.innerText = data.chord;
            box.appendChild(chordLabel);
        }

        box.ondragover = (e) => { e.preventDefault(); box.classList.add('dragover'); };
        box.ondragleave = () => box.classList.remove('dragover');
        box.ondrop = (e) => {
            e.preventDefault();
            box.classList.remove('dragover');
            const dropData = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (dropData.chord && dropData.chord !== "---") {
                chordHistory[i] = dropData;
                updateAll();
            }
        };

        historyGrid.appendChild(box);

        if (data && data.notes && data.notes.length > 0) {
            try {
                const renderer = new Renderer(box, Renderer.Backends.SVG);
                renderer.resize(110, 200);
                const context = renderer.getContext();
                const stave = new Stave(0, 30, 100);
                stave.setContext(context).draw();

                const parsedNotes = data.notes.map(parseNoteForVex);
                const keys = parsedNotes.map(p => p.key);

                const staveNote = new StaveNote({ keys: keys, duration: "w" });
                parsedNotes.forEach((p, idx) => {
                    if (p.acc) staveNote.addModifier(new Accidental(p.acc), idx);
                });

                const voice = new Voice({ num_beats: 4, beat_value: 4 });
                voice.addTickables([staveNote]);
                new Formatter().joinVoices([voice]).format([voice], 60);
                voice.draw(context, stave);
            } catch(err) {}
        }
    }
}

function addCurrentToHistory() {
    const chordName = document.getElementById('chord-drag').innerText;
    const notesArr = Array.from(activeNotes);
    if (notesArr.length === 0 || chordName === "---") return;

    const emptyIndex = chordHistory.findIndex(item => item === null);
    const targetIdx = emptyIndex !== -1 ? emptyIndex : 7;
    chordHistory[targetIdx] = { chord: chordName, notes: notesArr };
    updateAll();
}

function clearHistory() {
    chordHistory = new Array(8).fill(null);
    updateAll();
}

// --- 7. テンキープール (1〜9, 0) ＆ 再生処理 ---
const poolGrid = document.getElementById('pool-grid');
POOL_KEYS.forEach(num => {
    const box = document.createElement('div');
    box.className = 'pool-box';
    box.id = `pool-box-${num}`;
    box.dataset.num = num;
    box.innerHTML = `<span class="num">Num [${num}]</span><span class="chord-val">---</span>`;

    box.ondragover = (e) => { e.preventDefault(); box.classList.add('dragover'); };
    box.ondragleave = () => box.classList.remove('dragover');
    box.ondrop = (e) => {
        e.preventDefault();
        box.classList.remove('dragover');
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        if (data.chord && data.chord !== "---") {
            poolData[num] = data;
            box.querySelector('.chord-val').innerText = data.chord;
        }
    };
    poolGrid.appendChild(box);
});

document.getElementById('chord-drag').ondragstart = (e) => {
    const chordName = e.target.innerText;
    const notesArr = Array.from(activeNotes);
    e.dataTransfer.setData('text/plain', JSON.stringify({ chord: chordName, notes: notesArr }));
};

// プール順次再生処理
function togglePoolPlayback() {
    const btn = document.getElementById('pool-play-btn');
    if (isPlayingPool) {
        stopPoolPlayback();
    } else {
        isPlayingPool = true;
        btn.innerText = "■ 停止";
        btn.classList.add('playing');
        playPoolStep(0);
    }
}

function stopPoolPlayback() {
    isPlayingPool = false;
    if (poolPlayTimeout) clearTimeout(poolPlayTimeout);
    const btn = document.getElementById('pool-play-btn');
    btn.innerText = "▶ 再生";
    btn.classList.remove('playing');
    document.querySelectorAll('.pool-box').forEach(b => b.classList.remove('active-play'));
}

function playPoolStep(stepIndex) {
    if (!isPlayingPool) return;

    if (stepIndex >= POOL_KEYS.length) {
        stopPoolPlayback();
        return;
    }

    const key = POOL_KEYS[stepIndex];
    document.querySelectorAll('.pool-box').forEach(b => b.classList.remove('active-play'));
    const currentBox = document.getElementById(`pool-box-${key}`);
    if (currentBox) currentBox.classList.add('active-play');

    const bpm = parseFloat(document.getElementById('pool-bpm').value) || 120;
    const durationStr = document.getElementById('pool-duration').value;
    
    // 音価計算
    let beatRatio = 1.0;
    if (durationStr === '1n') beatRatio = 4.0;
    else if (durationStr === '2n') beatRatio = 2.0;
    else if (durationStr === '4n') beatRatio = 1.0;
    else if (durationStr === '8n') beatRatio = 0.5;

    const intervalMs = (60 / bpm) * beatRatio * 1000;

    if (poolData[key] && poolData[key].notes) {
        initAudio();
        synth.triggerAttackRelease(poolData[key].notes, durationStr);
        sendMidiChord(poolData[key].notes, (intervalMs / 1000) * 0.9);
    }

    poolPlayTimeout = setTimeout(() => {
        playPoolStep(stepIndex + 1);
    }, intervalMs);
}

// --- 8. Web MIDI API (入力/出力を分離選択) ---
const midiInSelect  = document.getElementById('midi-in-select');
const midiOutSelect = document.getElementById('midi-out-select');

function setupMIDI() {
    if (!navigator.requestMIDIAccess) {
        midiInSelect.innerHTML = '<option value="">Web MIDI API 非対応</option>';
        midiOutSelect.innerHTML = '<option value="">Web MIDI API 非対応</option>';
        return;
    }
    navigator.requestMIDIAccess().then(access => {
        midiAccessObj = access;
        updateMIDIDeviceLists();
        midiAccessObj.onstatechange = () => updateMIDIDeviceLists();
    }).catch(err => {
        midiInSelect.innerHTML = `<option value="">制限あり: ${err}</option>`;
        midiOutSelect.innerHTML = `<option value="">制限あり: ${err}</option>`;
    });
}

function updateMIDIDeviceLists() {
    // 入力デバイス設定
    const inputs = Array.from(midiAccessObj.inputs.values());
    midiInSelect.innerHTML = '';
    if (inputs.length === 0) {
        midiInSelect.innerHTML = '<option value="">MIDI入力が検出されません</option>';
    } else {
        const opt = document.createElement('option');
        opt.value = ""; opt.innerText = "-- MIDI入力デバイスを選択 --";
        midiInSelect.appendChild(opt);
        inputs.forEach(i => {
            const o = document.createElement('option');
            o.value = i.id; o.innerText = `${i.name}`;
            midiInSelect.appendChild(o);
        });
    }

    midiInSelect.onchange = () => {
        if (currentMidiInput) currentMidiInput.onmidimessage = null;
        const selected = inputs.find(i => i.id === midiInSelect.value);
        if (selected) {
            currentMidiInput = selected;
            currentMidiInput.onmidimessage = handleMIDIMessage;
        }
    };

    // 出力デバイス設定
    const outputs = Array.from(midiAccessObj.outputs.values());
    midiOutSelect.innerHTML = '';
    if (outputs.length === 0) {
        midiOutSelect.innerHTML = '<option value="">MIDI出力が検出されません</option>';
    } else {
        const opt = document.createElement('option');
        opt.value = ""; opt.innerText = "-- MIDI出力デバイスを選択 --";
        midiOutSelect.appendChild(opt);
        outputs.forEach(o => {
            const op = document.createElement('option');
            op.value = o.id; op.innerText = `${o.name}`;
            midiOutSelect.appendChild(op);
        });
    }

    midiOutSelect.onchange = () => {
        currentMidiOutput = outputs.find(o => o.id === midiOutSelect.value) || null;
    };
}

function handleMIDIMessage(msg) {
    const [status, noteNum, velocity] = msg.data;
    const command = status >> 4;
    const noteName = Tonal.Note.fromMidi(noteNum);
    if (command === 9 && velocity > 0) {
        toggleNote(noteName);
    }
}

// MIDI出力送信処理
function sendMidiNote(noteName, isOn) {
    if (!currentMidiOutput) return;
    const midiNum = Tonal.Note.midi(noteName);
    if (midiNum !== null) {
        const cmd = isOn ? 0x90 : 0x80;
        currentMidiOutput.send([cmd, midiNum, isOn ? 0x7f : 0x00]);
    }
}

function sendMidiChord(notesArr, durationSec) {
    if (!currentMidiOutput || !notesArr || notesArr.length === 0) return;
    notesArr.forEach(noteName => {
        const midiNum = Tonal.Note.midi(noteName);
        if (midiNum !== null) {
            currentMidiOutput.send([0x90, midiNum, 0x7f]);
            setTimeout(() => {
                currentMidiOutput.send([0x80, midiNum, 0x00]);
            }, durationSec * 1000);
        }
    });
}

// --- 9. キーボード＆テンキーイベント ---
window.addEventListener('keydown', (e) => {
    initAudio();
    if (e.repeat) return;
    const key = e.key.toLowerCase();

    if (PC_KEY_MAP[key]) {
        toggleNote(PC_KEY_MAP[key]);
    }

    let numKey = null;
    if (e.code.startsWith('Numpad')) numKey = e.code.replace('Numpad', '');
    else if (POOL_KEYS.includes(e.key)) numKey = e.key;

    if (numKey && poolData[numKey]) {
        const durationStr = document.getElementById('pool-duration').value;
        synth.triggerAttackRelease(poolData[numKey].notes, durationStr);
        sendMidiChord(poolData[numKey].notes, 1.0);
    }
});

setupMIDI();
updateAll();
</script>
